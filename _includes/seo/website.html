<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ '/' | absolute_url }}#website",
  "name": {{ site.title | jsonify }},
  "url": "{{ '/' | absolute_url }}",
  "description": {{ site.description | jsonify }},
  "inLanguage": ["en", "es"],
  "publisher": { "@id": "{{ '/' | absolute_url }}#organization" }
}
</script>
