{%- assign cur_lang = page.lang | default: 'en' -%}
{%- if cur_lang == 'es' -%}
  {%- assign home_url = '/es/' | absolute_url -%}
  {%- assign home_name = 'Inicio' -%}
{%- else -%}
  {%- assign home_url = '/en/' | absolute_url -%}
  {%- assign home_name = 'Home' -%}
{%- endif -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": {{ home_name | jsonify }}, "item": "{{ home_url }}" },
    { "@type": "ListItem", "position": 2, "name": {{ page.title | strip_html | normalize_whitespace | jsonify }}, "item": "{{ page.url | absolute_url }}" }
  ]
}
</script>
